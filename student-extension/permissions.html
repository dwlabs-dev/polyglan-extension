<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglan - Permissão de Microfone</title>
    <style>
        :root {
            --primary: #FFB347;
            --primary-dark: #FF8C00;
            --bg: #0F172A;
            --card-bg: #1E293B;
            --text: #F1F5F9;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 179, 71, 0.1);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrapper {
            background: rgba(255, 179, 71, 0.1);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .icon {
            font-size: 2.5rem;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: 1.75rem;
            background: linear-gradient(to right, #FFB347, #FFCC33);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            line-height: 1.6;
            color: #94A3B8;
            margin-bottom: 2rem;
        }

        button {
            background: var(--primary);
            color: var(--bg);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(255, 179, 71, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            display: none;
        }

        .status.error {
            color: #EF4444;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrapper">
            <span class="icon">🎙️</span>
        </div>
        <h1>Ativar Microfone</h1>
        <p>
            O Polyglan precisa de acesso ao microfone para capturar o áudio da sua aula. 
            Clique no botão abaixo e selecione <strong>"Permitir"</strong> no navegador.
        </p>
        <button id="requestBtn">
            <span>Ativar Microfone</span>
        </button>
        <div id="status" class="status"></div>
    </div>
    <script type="module" src="/permissions.ts"></script>
</body>
</html>
